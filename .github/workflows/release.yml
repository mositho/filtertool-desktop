name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e 'const fs = require("fs"); const v = require("./package.json").version; if (process.env.TAG !== `v${v}`) throw Error("Tag must match package.json"); if (!fs.readFileSync("build/config.yml", "utf8").includes(`version: "${v}"`)) throw Error("Update build/config.yml version too")'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run build
      - run: node scripts/wails.mjs generate webview2bootstrapper -dir build/windows
      - name: Build per-user installer
        shell: pwsh
        run: |
          if (!(Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis --yes --no-progress }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=$((Get-Content package.json | ConvertFrom-Json).version)" build/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash bin/Filtertool.exe, bin/Filtertool-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding ascii bin/SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--draft --verify-tag --generate-notes --title "Filtertool $TAG")
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" bin/Filtertool.exe bin/Filtertool-Setup.exe bin/SHA256SUMS.txt "${args[@]}" --notes 'Windows desktop release. Review Windows validation and third-party source redistribution requirements before publishing. User data is stored in %APPDATA%\Filtertool.'
