name: Release
run-name: Release v${{ inputs.version }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (major.minor.patch, e.g. 1.0.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != refs/heads/main ]]; then
            echo "Run releases from main only."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/set-version.mjs "$RELEASE_VERSION"
          TAG="v$RELEASE_VERSION"
          node scripts/check-version.mjs "$TAG"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists. Choose a new version."
            exit 1
          fi
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "main has changed. Start a new release run from its latest commit."
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      release-version: ${{ needs.validate.outputs.version }}
  package:
    needs: [validate, checks]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prepare release version
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: node scripts/set-version.mjs "$RELEASE_VERSION"
      - run: npm ci
      - run: npm run build
      - run: node scripts/wails.mjs generate webview2bootstrapper -dir build/windows
      - name: Build per-user installer
        shell: pwsh
        run: |
          if (!(Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis --yes --no-progress }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=$((Get-Content package.json | ConvertFrom-Json).version)" build/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash bin/Filtertool.exe, bin/Filtertool-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding ascii bin/SHA256SUMS.txt
      - name: Commit version and push tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          HUSKY: "0"
        shell: bash
        run: |
          node scripts/check-version.mjs "$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json build/config.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $TAG"
          fi
          git tag -a "$TAG" -m "Filtertool $TAG"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          args=(--draft --verify-tag --generate-notes --title "Filtertool $TAG")
          gh release create "$TAG" bin/Filtertool.exe bin/Filtertool-Setup.exe bin/SHA256SUMS.txt LICENSE docs/THIRD_PARTY.md "${args[@]}" --notes 'Requires 64-bit Windows 10/11 and WebView2. TTS generation additionally requires a separately installed FFmpeg on PATH and internet access; FFmpeg is not included. User data is stored in %APPDATA%\Filtertool. Before publishing this draft, complete docs/RELEASING.md.'
