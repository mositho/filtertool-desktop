name: Release
run-name: Release v${{ inputs.version }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (major.minor.patch, e.g. 1.0.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/set-version.mjs "$RELEASE_VERSION"
          TAG="v$RELEASE_VERSION"
          node scripts/check-version.mjs "$TAG"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists. Choose a new version."
            exit 1
          fi
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "main has changed. Start a fresh run from its latest commit."
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- package.json package-lock.json build/config.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.changed == 'true'
        with:
          name: prepared-version
          retention-days: 7
          if-no-files-found: error
          path: |
            package.json
            package-lock.json
            build/config.yml

  version-branch:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-version
          path: prepared
      - name: Prepare branch for manual review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/push-prepared-branch.sh release

  checks:
    needs: validate
    if: needs.validate.outputs.changed == 'false'
    uses: ./.github/workflows/ci.yml

  package:
    needs: [validate, checks]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          retention-days: 7
          if-no-files-found: error
          path: |
            bin/Filtertool.exe
            bin/Filtertool-Setup.exe
            bin/SHA256SUMS.txt

  draft:
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Fresh runner: no npm install, compiler, installer or artifact executable is run here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Verify artifact checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Tag reviewed source and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "main has changed. Start a fresh release run."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null tag -a "$TAG" "$GITHUB_SHA" -m "Filtertool $TAG"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          git push origin "refs/tags/$TAG"
          REPO_URL="https://github.com/$GITHUB_REPOSITORY"
          CHANGELOG_URL="$REPO_URL/commits/$TAG"
          if PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null); then
            CHANGELOG_URL="$REPO_URL/compare/$PREVIOUS_TAG...$TAG"
          fi
          cat > release-notes.md <<EOF
          ## Download

          - **[Filtertool-Setup.exe]($REPO_URL/releases/download/$TAG/Filtertool-Setup.exe)** — recommended; installs Filtertool and sets up WebView2 if needed.
          - **[Filtertool.exe]($REPO_URL/releases/download/$TAG/Filtertool.exe)** — run without installing (requires WebView2).

          For 64-bit Windows 10 or 11. TTS sound generation also needs a separate FFmpeg installation.

          **[Get started]($REPO_URL/blob/$TAG/README.md#get-started)** · [Quick guide]($REPO_URL/blob/$TAG/README.md#quick-guide) · [Changelog]($CHANGELOG_URL)
          EOF
          gh release create "$TAG" release-assets/Filtertool.exe release-assets/Filtertool-Setup.exe release-assets/SHA256SUMS.txt LICENSE docs/THIRD_PARTY.md --draft --verify-tag --title "Filtertool $TAG" --notes-file release-notes.md
